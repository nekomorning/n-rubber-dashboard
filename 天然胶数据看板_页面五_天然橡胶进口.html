  // 近12个月累计对比
  cmpChart = echarts.init(document.getElementById("cmpChart"));
  var data=ORDER.filter(function(c){return countries[c];}).map(function(c){
    var s=countries[c].series.filter(function(p){return p.value!==null;});
    var last12=s.slice(-12);
    var tot=last12.reduce(function(a,p){return a+p.value;},0);
    return {name:c, value:Math.round(tot)};
  });
  cmpChart.setOption({
    tooltip:{trigger:"item", formatter:function(p){return p.name+": "+fmt(p.value,0)+" 吨";}},
    grid:{left:70, right:24, top:20, bottom:30},
    xAxis:{type:"category", data:data.map(function(d){return d.name;})},
    yAxis:{type:"value", name:"吨（近12月累计）"},
    series:[{type:"bar", data:data.map(function(d){return {value:d.value, itemStyle:{color:COLORS[d.name]}};}),
      label:{show:true, position:"top", formatter:function(p){return fmt(p.value,0);}, fontSize:11}}]
  });

  window.addEventListener("resize", function(){
    mainChart.resize(); yearChart.resize(); cmpChart.resize();
  });
}

// ===== 明细表（无需 ECharts）=====
(function(){
  var tb=document.querySelector("#dataTable tbody");
  ORDER.forEach(function(c){
    if(!countries[c]) return;
    var l=latestOf(c), p=prevOf(c), y=yoyOf(c);
    var momPct=(l&&p&&p.value)?(l.value-p.value)/p.value*100:null;
    var yoyPct=(l&&y)?(l.value-y)/y*100:null;
    var ly=l?l.month.slice(0,4):""; var tot=0,has=false;
    countries[c].series.forEach(function(pp){ if(pp.value!==null && pp.month.slice(0,4)===ly){tot+=pp.value;has=true;} });
    function cell(v,cls){ return '<td class="'+(cls||'')+'">'+v+'</td>'; }
    var momCell = momPct===null? cell("—","flat") : cell((momPct>=0?"+":"")+fmt(momPct,1)+"%", chgCls(momPct));
    var yoyCell = yoyPct===null? cell("—","flat") : cell((yoyPct>=0?"+":"")+fmt(yoyPct,1)+"%", chgCls(yoyPct));
    tb.insertAdjacentHTML("beforeend",
      "<tr><td><b>"+c+"</b></td>"+cell(l.month)+cell(fmt(l.value,0))+momCell+yoyCell+
      cell(countries[c].range[0])+cell(countries[c].range[1])+cell(has?fmt(Math.round(tot),0):"—")+"</tr>");
  });
  document.getElementById("srcNote").textContent =
    "数据来源：" + D.source + "。单位：吨（原始数据千克换算）。各国历史起始年份不同，取决于 QinRex 数据覆盖。";
})();

// ===== 加载 ECharts（多 CDN 回退）=====
(function(){
  var urls=[
    "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
    "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"
  ];
  var i=0;
  function tryNext(){
    if(i>=urls.length){document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>ECharts 加载失败，请检查网络后刷新。</div>");return;}
    var s=document.createElement("script");
    s.src=urls[i++]; s.onload=initCharts; s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

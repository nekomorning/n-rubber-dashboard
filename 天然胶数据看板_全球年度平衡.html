<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天然胶数据看板 · 全球年度平衡</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --sub:#6b7686;
  --up:#d8392b; --down:#1a8a4a; --flat:#8a93a3; --accent:#0f4c81;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; font-size:14px;}
.wrap{max-width:1560px; margin:0 auto; padding:18px 22px 60px;}
.header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.header h1{font-size:24px; color:var(--accent); letter-spacing:1px;}
.header .date{color:var(--sub); font-size:13px;}
.tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 20px; border-radius:8px 8px 0 0; border:1px solid var(--border); border-bottom:none;
  background:#e9edf3; color:var(--sub); cursor:default; font-size:14px; text-decoration:none;}
.tab.active{background:var(--accent); color:#fff; font-weight:600;}
a.tab:hover{background:var(--accent); color:#fff;}

.section-title{font-size:18px; color:var(--accent); font-weight:700; margin:26px 0 4px;
  padding-left:10px; border-left:4px solid var(--accent);}
.sub-inline{font-size:12px; color:var(--sub); font-weight:400; margin-left:8px;}

.tbl-scroll{overflow:auto; max-height:560px; border:1px solid var(--border); border-radius:8px; margin-top:8px;}
table.data{border-collapse:collapse; width:100%; font-size:12px; background:var(--card);}
table.data th, table.data td{border:1px solid var(--border); padding:4px 6px; text-align:center; white-space:nowrap;}
table.data thead th{position:sticky; top:0; background:var(--accent); color:#fff; z-index:2; font-weight:600;}
table.data thead tr:nth-child(2) th{top:26px;}
table.data tbody tr:nth-child(even){background:#fafbfd;}
table.data td.yr-col, table.data th.yr-col{position:sticky; left:0; background:#eef2f7; font-weight:600; text-align:left; z-index:1;}
table.data thead th.yr-col{background:var(--accent); z-index:4;}
table.data thead tr:nth-child(2) th.yr-col{top:0; z-index:5;}
.val-null{color:var(--flat);}
td .pos{color:var(--up);} td .neg{color:var(--down);}
/* 全球总产量 / 全球总需求 突出显示 */
table.data td.tot{font-weight:700; background:#eef3fa; color:#1f2733;}
table.data tbody tr:nth-child(even) td.tot{background:#e9eff8;}

.toggle-bar{display:flex; align-items:center; gap:0; margin-top:8px; padding:0;}
.toggle-btn{padding:6px 22px; border:1px solid var(--border); background:#e9edf3; color:var(--sub);
  font-size:13px; cursor:pointer; border-radius:6px 0 0 6px;}
.toggle-btn:last-of-type{border-radius:0 6px 6px 0; border-left:none;}
.toggle-btn.active{background:var(--accent); color:#fff; font-weight:600;}
.toggle-btn:not(.active):hover{background:#d7dee8;}
.toggle-note{font-size:12px; color:var(--sub); margin-left:12px;}

/* 历史数据折叠 */
.collapse-bar{margin:10px 0 6px;}
.collapse-btn{padding:6px 16px; border:1px solid var(--border); background:#fff; color:var(--accent);
  font-size:13px; cursor:pointer; border-radius:6px; user-select:none;}
.collapse-btn:hover{background:#eef2f7;}
.collapse-btn .arrow{display:inline-block; transition:transform .2s; margin-left:6px; color:var(--sub);}
.collapse-btn.open .arrow{transform:rotate(180deg);}
table.data.collapsed tr.hist{display:none;}
.chart-box{position:relative; border:1px solid var(--border); border-radius:8px; background:var(--card); margin-top:8px;}
.chart-box .chart-title{font-size:13px; color:var(--accent); font-weight:600; padding:10px 14px 0;}
.chart-box .chart-sub{font-size:11px; color:var(--sub); padding:2px 14px 8px;}
.chart-box .ech{width:100%; height:320px;}
.chart-box .ech.tall{height:500px;}
.chart-box .cal-note-out{position:absolute; top:-12px; right:0; z-index:2;
  padding:3px 8px; background:#fff5f5; border:1px solid #d8392b; border-radius:3px;
  font-size:10px; color:#d8392b; font-weight:700; line-height:1.2;}

.footer{margin-top:30px; color:var(--sub); font-size:12px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 id="pageTitle">全球年度平衡</h1>
    <div class="date" id="pageSub"></div>
  </div>
  <div class="tabs" id="tabs"></div>

  <div class="section-title">年度平衡 · 绝对值<span class="sub-inline" id="mainSub"></span></div>
  <div class="collapse-bar">
    <button class="collapse-btn" id="btnHist"><span id="histLabel">展开 2008–2016 历史数据（9 年）</span><span class="arrow">▾</span></button>
  </div>
  <div class="chart-box">
    <div class="chart-title">全球产量 · 消费量（折线，左轴） / 供需平衡（柱状，右轴）</div>
    <div class="chart-sub">万吨 · 2008 ~ 2027E（E 为预测）</div>
    <div class="ech" id="mainChart"></div>
    <div class="cal-note-out">数据口径问题，0轴无意义，主要看变化趋势</div>
  </div>
  <div class="tbl-scroll" id="mainScroll"><table class="data collapsed" id="mainTable"></table></div>

  <div class="section-title">年度平衡 · 增速 / 增量<span class="sub-inline" id="gdSub"></span></div>
  <div class="toggle-bar">
    <button class="toggle-btn active" id="btnPct">增速 %</button>
    <button class="toggle-btn" id="btnDelta">增量（万吨）</button>
    <span class="toggle-note" id="gdNote"></span>
  </div>
  <div class="tbl-scroll" id="gdScroll"><table class="data" id="gdTable"></table></div>
  <div class="chart-box">
    <div class="chart-title" id="gdChartTitle">各国 2019 ~ 2027E 产量增速 %</div>
    <div class="chart-sub" id="gdChartSub">% · 2019 ~ 2027E（E 为预测）</div>
    <div class="ech tall" id="gdChart"></div>
  </div>

  <div class="footer">天然胶数据看板 · 全球年度平衡 · 数据来源：橡胶各国平衡表 · 单位：万吨 / %</div>
</div>

    {id:"p2",label:"天胶库存",file:"天然胶数据看板_页面二_库存.html"},
    {id:"p3",label:"下游轮胎",file:"天然胶数据看板_页面三_轮胎.html"},
    {id:"p7",label:"重卡",file:"天然胶数据看板_页面七_重卡.html"},
    {id:"p4",label:"天气数据",file:"天然胶数据看板_页面四_天气数据.html"},
    {id:"gbal",label:"全球年度平衡",file:"天然胶数据看板_全球年度平衡.html"},
    {id:"p8",label:"ANRPC平衡表",file:"天然胶数据看板_页面八_ANRPC产消.html"},
    {id:"plant",label:"种面单产",file:"天然胶数据看板_种面单产.html"},
  {id:"trade",label:"贸易流",file:"天然胶数据看板_贸易流.html"},

    else { var a=document.createElement("a"); a.className="tab"; a.href=tb.file; a.textContent=tb.label; bar.appendChild(a); }
  });
}

/* ---------- 表头（两级：分组行 + 列名行） ---------- */
function headCells(firstCol){
  var h="<tr><th class='yr-col' rowspan='2'>"+firstCol+"</th>";
  // 分组行：产量 / 供需平衡 / 消费量
  for(var gi=0; gi<D.groups.length; gi++){
    var g=D.groups[gi];
    h+="<th colspan='"+g.cols.length+"' style='background:"+gColor(g.label)+";color:#fff;'>"+g.label+"</th>";
  }
  h+="</tr><tr>";
  // 列名行：全球总产量 / 全球总消费量 等单列显示
  for(var gi=0; gi<D.groups.length; gi++){
    var g=D.groups[gi];
    g.cols.forEach(function(c){
      var isTot=(c.key==='B'||c.key==='R');
      h+="<th"+(isTot?" class='tot'":"")+" style='background:"+gColor(g.label)+";color:#fff;'>"+c.name+"</th>";
    });
  }
  return h+"</tr>";
}
function gColor(label){
  if(label.indexOf("产量")>=0) return "#7FA996";      // 浅绿
  if(label.indexOf("供需平衡")>=0) return "#5F7A8C";   // 石蓝灰
  if(label.indexOf("总需求")>=0) return "#E08E8E";    // 浅红
  if(label.indexOf("消费")>=0) return "#E08E8E";       // 浅红
  return "#0f4c81";
}

/* ---------- 主表：绝对值（万吨） ---------- */
function renderMain(){
  var head="<thead>"+headCells("年份")+"</thead>";
  var body="<tbody>";
  D.mainYears.forEach(function(y){
    var yNum=parseInt(y); var isHist=(yNum<=HIST_MAX);
    body+="<tr"+(isHist?" class='hist'":"")+"><td class='yr-col'>"+y+"</td>";
    for(var gi=0; gi<D.groups.length; gi++){
      var g=D.groups[gi];
      g.cols.forEach(function(c){
        var v=D.main[y][c.key];
        var isTot=(c.key==='B'||c.key==='R');
        var st=(c.key==='Q') ? signStyle(v) : "";  // 仅供需平衡保留红绿，其余全黑字
        body+="<td"+(isTot?" class='tot'":"")+st+">"+fmt(v,false)+"</td>";
      });
    }
    body+="</tr>";
  });
  body+="</tbody>";
  document.getElementById("mainTable").innerHTML=head+body;
  document.getElementById("mainSub").textContent=
    "全球及细分国家年度产量 / 消费量（万吨）· "+D.mainYears[0]+" ~ "+D.mainYears[D.mainYears.length-1]+"（E 为预测）";
}

/* ---------- 增速 / 增量表（标签切换） ---------- */
function renderGd(){
  var isPct = view==="pct";
  var years = isPct ? D.growthYears : D.deltaYears;
  var block = isPct ? D.growth : D.delta;
  var head="<thead>"+headCells(isPct?"年份":"年份")+"</thead>";
  var body="<tbody>";
  years.forEach(function(y){
    body+="<tr><td class='yr-col'>"+y+"</td>";
    D.groups.forEach(function(g){
      g.cols.forEach(function(c){
        var v=block[y][c.key];
        var isTot=(c.key==='B'||c.key==='R');
        body+="<td"+(isTot?" class='tot'":"")+signStyle(v)+">"+fmt(v,isPct)+"</td>";
      });
    });
    body+="</tr>";
  });
  body+="</tbody>";
  document.getElementById("gdTable").innerHTML=head+body;
  document.getElementById("gdNote").textContent = isPct
    ? "增速为同比变化（%），红涨绿跌；—— 为底稿未给出增速（无预测）"
    : "增量为当年较上年绝对变化（万吨）；26-19增量 为 2026E 较 2019 增量";
  document.getElementById("btnPct").classList.toggle("active", isPct);
  document.getElementById("btnDelta").classList.toggle("active", !isPct);
}

function bindHist(){
  var btn=document.getElementById("btnHist");
  if(!btn) return;
  btn.onclick=function(){
    showHist=!showHist;
    document.getElementById("mainTable").classList.toggle("collapsed", !showHist);
    btn.classList.toggle("open", showHist);
    document.getElementById("histLabel").textContent = showHist
      ? "收起 2008–2016 历史数据" : "展开 2008–2016 历史数据（9 年）";
  };
}

/* ---------- 全球产量/消费量柱状 + 供需平衡折线（右轴） ---------- */
function gbalChartOption(){
  var years=D.mainYears.map(String);
  function col(key){ return years.map(function(y){ return (D.main[y]&&D.main[y][key]!==undefined)?D.main[y][key]:null; }); }
  return {
    color:["#7FA996","#E08E8E","#5F7A8C"],
    tooltip:{trigger:"axis", axisPointer:{type:"shadow"}},
    legend:{data:["全球产量","全球消费量","供需平衡"], top:4, textStyle:{fontSize:12}},
    grid:{left:8, right:8, top:36, bottom:26, containLabel:true},
    xAxis:{type:"category", data:years, axisLabel:{interval:0, fontSize:11}},
    yAxis:[
      {type:"value", name:"万吨", min:600, max:1800, nameTextStyle:{color:"#6b7686"}, splitLine:{lineStyle:{color:"#e5e9f0"}}},
      {type:"value", name:"万吨", nameTextStyle:{color:"#6b7686"}, splitLine:{show:false}}
    ],
    series:[
      {name:"全球产量", type:"line", data:col("B"), showSymbol:true, symbolSize:6,
       lineStyle:{color:"#7FA996", width:2.5}, itemStyle:{color:"#7FA996"}, z:10},
      {name:"全球消费量", type:"line", data:col("R"), showSymbol:true, symbolSize:6,
       lineStyle:{color:"#E08E8E", width:2.5}, itemStyle:{color:"#E08E8E"}, z:9},
      {name:"供需平衡", type:"bar", yAxisIndex:1, data:col("Q"), barMaxWidth:22,
       itemStyle:{color:"#5F7A8C", opacity:.75}}
    ]
  };
}

/* ---------- 增速/增量图表：各国产量 2019-2027E ---------- */
/* 国家顺序：全球总产量在前，其他按产量组原顺序；剔除菲律宾/斯里兰卡，11 国；增速默认显示 5 国（全球总产量+科特迪瓦+泰国+印尼+越南），其他图例点击恢复 */
var GD_CHART_YEARS = ["2019","2020","2021","2022","2023","2024","2025","2026E","2027E"];
var GD_CHART_COUNTRIES = [
  {key:"B", name:"全球总产量", color:"#2C3E50", isTot:true, defaultShow:true},
  {key:"C", name:"科特迪瓦", color:"#7B241C", defaultShow:true},
  {key:"E", name:"泰国", color:"#C0392B", defaultShow:true},
  {key:"F", name:"印尼", color:"#E67E22", defaultShow:true},
  {key:"G", name:"越南", color:"#1ABC9C", defaultShow:true},
  {key:"H", name:"马来", color:"#3498DB", defaultShow:false},
  {key:"I", name:"柬埔寨", color:"#E84393", defaultShow:false},
  {key:"J", name:"缅甸", color:"#D35400", defaultShow:false},
  {key:"K", name:"老挝", color:"#9B59B6", defaultShow:false},
  {key:"N", name:"中国", color:"#2980B9", defaultShow:false},
  {key:"O", name:"印度", color:"#2ECC71", defaultShow:false},
];
// 增量模式年份配色（蓝→青→绿→黄→橙→红→深红→紫红 渐变；2026E 深红+白边+阴影，2027E 紫红+白边+阴影，明显区分）
var GD_YEAR_COLORS = {
  "2019":"#3498DB","2020":"#1ABC9C","2021":"#2ECC71","2022":"#F1C40F","2023":"#E67E22",
  "2024":"#D35400","2025":"#E74C3C","2026E":"#C0392B","2027E":"#8E44AD",
};
function gdChartOption(){
  var isPct = view==="pct";
  if(isPct){
    // 折线图：x=年份，每国家一条线
    var legendSelected = {};
    GD_CHART_COUNTRIES.forEach(function(c){ legendSelected[c.name] = c.defaultShow; });
    var series = GD_CHART_COUNTRIES.map(function(c){
      var data = GD_CHART_YEARS.map(function(y){ return srcForView(isPct)[y]?srcForView(isPct)[y][c.key]:null; });
      return {name:c.name, type:"line", data:data, showSymbol:true, symbolSize:5,
        lineStyle:{width: c.isTot?2.4:1.6, color:c.color}, itemStyle:{color:c.color},
        emphasis:{focus:"series"}, z: c.isTot?12:8};
    });
    return {
      color: GD_CHART_COUNTRIES.map(function(c){return c.color;}),
      tooltip:{trigger:"axis", axisPointer:{type:"line"}, confine:true,
        valueFormatter:function(v){ return v===null||v===undefined?"—":v.toFixed(1)+"%"; }},
      legend:{data:GD_CHART_COUNTRIES.map(function(c){return c.name;}), top:4,
        type:"scroll", textStyle:{fontSize:10, color:"#6b7686"}, selected:legendSelected},
      grid:{left:8, right:8, top:48, bottom:26, containLabel:true},
      xAxis:{type:"category", data:GD_CHART_YEARS,
        axisLabel:{interval:0, fontSize:11, color:"#8a93a3"},
        axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}}, splitLine:{show:false}},
      yAxis:{type:"value", name:"%（同比）", nameTextStyle:{color:"#6b7686"},
        axisLabel:{fontSize:10, color:"#8a93a3"},
        splitLine:{lineStyle:{color:"#eef1f6"}}},
      series:series
    };
  }
  // 增量模式柱状图：x=国家（13 国堆叠），series=年份（9 个），legend=年份，2026E/2027E 用醒目色
  var xData = GD_CHART_COUNTRIES.map(function(c){return c.name;});
  var legendSelected = {};  // 全显示
  GD_CHART_YEARS.forEach(function(y){ legendSelected[y] = true; });
  var series = GD_CHART_YEARS.map(function(y){
    var data = GD_CHART_COUNTRIES.map(function(c){
      var src = srcForView(false);
      return (src[y] && src[y][c.key]!==undefined) ? src[y][c.key] : null;
    });
    var col = GD_YEAR_COLORS[y] || "#888";
    var isHi = (y==="2026E" || y==="2027E");
    return {name:y, type:"bar", data:data, barMaxWidth:6,
      itemStyle:{color:col, borderColor:isHi?"#fff":"none",
        borderWidth:isHi?1.5:0, shadowBlur:isHi?8:0, shadowColor:isHi?col:"none"},
      emphasis:{focus:"series"}};
  });
  return {
    tooltip:{trigger:"axis", axisPointer:{type:"shadow"}, confine:true,
      valueFormatter:function(v){ return v===null||v===undefined?"—":v.toFixed(1); }},
    legend:{data:GD_CHART_YEARS.slice(), top:4,
      type:"scroll", textStyle:{fontSize:10, color:"#6b7686"}, selected:legendSelected},
    grid:{left:8, right:8, top:48, bottom:26, containLabel:true},
    xAxis:{type:"category", data:xData,
      axisLabel:{interval:0, fontSize:10, color:"#8a93a3", rotate:0},
      axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}}, splitLine:{show:false}},
    yAxis:{type:"value", name:"万吨（较上年变化）", nameTextStyle:{color:"#6b7686"},
      axisLabel:{fontSize:10, color:"#8a93a3"},
      splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  };
}
function srcForView(isPct){ return isPct ? D.growth : D.delta; }
function applyGdChartTitle(){
  var isPct = view==="pct";
  document.getElementById("gdChartTitle").textContent =
    isPct ? "各国 2019 ~ 2027E 产量增速 %（折线图）"
          : "各国 2019 ~ 2027E 产量增量（柱状图，万吨；横轴=国家，图例=年份）";
  document.getElementById("gdChartSub").textContent =
    isPct ? "% · 2019 ~ 2027E（E 为预测）· 红涨绿跌（同比）· 默认显示 5 国（图例点击可恢复）"
          : "万吨 · 2019 ~ 2027E（E 为预测，2026E/2027E 醒目色）· 正=较上年增加";
}
function renderCharts(){
  if(typeof echarts==="undefined"||!D||!D.main) return;
  var mainOpt=gbalChartOption();
  var mainEl=document.getElementById("mainChart");
  if(mainEl){
    var ch=echarts.init(mainEl);
    ch.setOption(mainOpt);
  }
  var gdEl=document.getElementById("gdChart");
  if(gdEl){
    var gd=echarts.init(gdEl);
    gd.setOption(gdChartOption());
  }
}

function init(){
  if(!D||!D.main){ document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>数据未加载</div>"); return; }
  document.getElementById("pageTitle").textContent=D.pageTitle;
  document.getElementById("pageSub").textContent=D.pageSub;
  buildTabs();
  renderMain();
  renderGd();
  bindHist();
  document.getElementById("btnPct").onclick=function(){ view="pct"; renderGd(); applyGdChartTitle(); renderCharts(); };
  document.getElementById("btnDelta").onclick=function(){ view="delta"; renderGd(); applyGdChartTitle(); renderCharts(); };
  applyGdChartTitle();
  renderCharts();
}
init();
</script>
<script>
/* ECharts 多 CDN 兜底加载，加载成功后再渲染图表（表格已同步渲染） */
(function loadECharts(){
  var urls=[
    "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
    "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"
  ];
  var i=0;
  function tryNext(){
    if(i>=urls.length){ document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>ECharts 加载失败，请检查网络后刷新。</div>"); return; }
    var s=document.createElement("script");
    s.src=urls[i++]; s.onload=renderCharts; s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

<!-- ===== 激光笔演示按钮（右下角，2026-08-14 起；v2 SVG图标+无外圈） ===== -->
<style>
.laser-fab{position:fixed; right:18px; bottom:18px; z-index:2147483000; width:42px; height:42px; border-radius:50%;
  background:#d8392b; color:#fff; font-size:0; line-height:1; display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.28); opacity:.92; transition:all .2s; border:none; padding:0;}
.laser-fab:hover{opacity:1; transform:scale(1.12);}
.laser-fab.active{background:#922B21; box-shadow:0 0 0 4px rgba(216,57,43,.28);}
.laser-dot{position:fixed; z-index:2147483001; width:18px; height:18px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,#fff 0%,#ff3b30 30%,rgba(255,59,48,.5) 70%,rgba(255,59,48,0) 100%);
  box-shadow:0 0 10px 4px rgba(255,59,48,.6), 0 0 24px 10px rgba(255,59,48,.25);
  transform:translate(-50%,-50%); display:none;}
body.laser-mode{cursor:none !important;}
body.laser-mode *{cursor:none !important;}
</style>
<script>
(function(){
  if(document.getElementById('laserFab')) return;
  var fab=document.createElement('div'); fab.id='laserFab'; fab.className='laser-fab';
  fab.title='激光笔（演示模式）';
  fab.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'
    +'<circle cx="12" cy="12" r="3.5" fill="#fff"/>'
    +'<circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.4" opacity="0.55"/>'
    +'<line x1="12" y1="2" x2="12" y2="5" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'<line x1="12" y1="19" x2="12" y2="22" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'<line x1="2" y1="12" x2="5" y2="12" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'<line x1="19" y1="12" x2="22" y2="12" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'</svg>';
  var dot=document.createElement('div'); dot.id='laserDot'; dot.className='laser-dot';
  document.body.appendChild(fab); document.body.appendChild(dot);
  var on=false;
  function setOn(v){
    on=v;
    dot.style.display=on?'block':'none';
    fab.classList.toggle('active', on);
    document.body.classList.toggle('laser-mode', on);
  }
  function move(e){
    if(!on) return;
    dot.style.left=e.clientX+'px'; dot.style.top=e.clientY+'px';
  }
  fab.addEventListener('click', function(e){ e.stopPropagation(); setOn(!on); });
  document.addEventListener('mousemove', move);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && on) setOn(false); });
  window.laserSetOn=setOn;
})();
</script>

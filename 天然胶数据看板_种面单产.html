<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天然胶数据看板 · 种面单产</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --sub:#6b7686;
  --up:#d92626; --down:#0a9a5c; --flat:#8a93a3; --accent:#0f4c81;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; font-size:14px;}
.wrap{max-width:1560px; margin:0 auto; padding:18px 22px 60px;}
.header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.header h1{font-size:24px; color:var(--accent); letter-spacing:1px;}
.header .date{color:var(--sub); font-size:13px;}
.tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 20px; border-radius:8px 8px 0 0; border:1px solid var(--border); border-bottom:none;
  background:#e9edf3; color:var(--sub); cursor:default; font-size:14px; text-decoration:none;}
.tab.active{background:var(--accent); color:#fff; font-weight:600;}
.tab.disabled{opacity:.55;}
a.tab:hover{background:var(--accent); color:#fff;}

.section-title{font-size:18px; color:var(--accent); font-weight:700; margin:26px 0 4px;
  padding-left:10px; border-left:4px solid var(--accent);}
.sub-inline{font-size:12px; color:var(--sub); font-weight:400; margin-left:8px;}

.tbl-scroll{overflow:auto; max-height:560px; border:1px solid var(--border); border-radius:8px; margin-top:8px;}
#annualScroll{max-height:520px;}
table.data{border-collapse:collapse; width:100%; font-size:12px; background:var(--card);}
table.data th, table.data td{border:1px solid var(--border); padding:4px 6px; text-align:center; white-space:nowrap;}
table.data thead th{position:sticky; top:0; background:var(--accent); color:#fff; z-index:2; font-weight:600;}
table.data thead tr:nth-child(2) th{top:26px;}
table.data tbody tr:nth-child(even){background:#fafbfd;}
table.data td.date-col, table.data th.date-col{position:sticky; left:0; background:#eef2f7; font-weight:600; text-align:left; z-index:1;}
table.data thead th.date-col{background:var(--accent); z-index:4;}
table.data thead tr:nth-child(2) th.date-col{top:0; z-index:5;}
.val-null{color:var(--flat);}

.filter-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; padding:10px 12px;
  background:var(--card); border:1px solid var(--border); border-radius:8px;}
.filter-bar label{color:var(--sub); font-size:13px;}
.filter-bar select{padding:4px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff;}

.chart-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-top:10px;}
.chart-grid.two{grid-template-columns:repeat(2, minmax(0,1fr));}
@media (max-width:1200px){ .chart-grid, .chart-grid.two{grid-template-columns:repeat(2, minmax(0,1fr));} }
@media (max-width:760px){ .chart-grid, .chart-grid.two{grid-template-columns:1fr;} }
.chart-card{border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--card); min-width:0;}
.chart-card .cap{font-size:13px; font-weight:700; color:var(--accent); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chart-card .ech{width:100%; height:360px; min-width:0;}
/* 国家标签栏（图表上方，点击切换过滤） */
.country-bar{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px; margin-top:8px;
  background:var(--card); border:1px solid var(--border); border-radius:8px; align-items:center;}
.country-bar .lbl{font-size:12px; color:var(--sub); margin-right:6px; font-weight:700;}
.country-pill{padding:5px 14px; border-radius:16px; border:1px solid var(--border);
  background:#fff; color:var(--sub); cursor:pointer; font-size:13px; transition:all .15s;}
.country-pill:hover{border-color:var(--accent); color:var(--accent);}
.country-pill.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
.country-pill.all{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
.footer{margin-top:30px; color:var(--sub); font-size:12px; text-align:center;}
.note{color:var(--sub); font-size:13px; padding:10px;}
</style>
</head>

function yearColor(y){ return YEAR_COLORS[String(y)] || "#888888"; }

function fmt(v, type){
  if(v===null || v===undefined || (typeof v==="number" && isNaN(v))) return "";
  if(type==="pct") return Math.round(v)+"%";          // 开割率：百分比保留整数

function vOf(c, ind, y){
  if(c==="全球合计"){ var g=(D.globalTotal||{})[ind]; return g ? g[y] : null; }
  var s=(D.series[c]||{})[ind];
  return s ? s[y] : null;
}

/* ---------- 年度数据表（两种视图，两级表头；每组/每国首列 = 全球合计） ---------- */
function getCols(){
  var cols=[], groups=[];
  if(curView==="byIndicator"){
    D.indicators.forEach(function(ind){
      groups.push({label:D.groupNames[ind], span:D.countries.length+1, color:D.colColors[ind]});
      cols.push({country:"全球合计", ind:ind, label:"全球合计", color:D.colColors[ind], isGlobal:true});
      D.countries.forEach(function(c){ cols.push({country:c, ind:ind, label:c, color:D.colColors[ind]}); });
    });
  } else {
    groups.push({label:"全球合计", span:D.indicators.length, color:"#0f4c81"});
    D.indicators.forEach(function(ind){
      cols.push({country:"全球合计", ind:ind, label:ind, color:D.colColors[ind], isGlobal:true});
    });
    D.countries.forEach(function(c){
      groups.push({label:c, span:D.indicators.length, color:"#0f4c81"});
      D.indicators.forEach(function(ind){
        cols.push({country:c, ind:ind, label:ind, color:D.colColors[ind]});
      });
    });
  }
  return {cols:cols, groups:groups};
}
function headCells(G){
  var h="<tr><th class='date-col' rowspan='2'>年份</th>";
  G.groups.forEach(function(g){
    h+="<th colspan='"+g.span+"' style='background:"+g.color+";color:#fff;'>"+g.label+"</th>";
  });
  h+="</tr><tr>";
  G.cols.forEach(function(col){ h+="<th style='background:"+col.color+";color:#fff;'>"+col.label+"</th>"; });
  return h+"</tr>";
}
function renderAnnual(){
  var G=getCols(); G.firstCol="年份";
  var head="<thead>"+headCells(G)+"</thead>";
  var body="<tbody>";
  D.years.forEach(function(y){
    body+="<tr><td class='date-col'>"+y+"</td>";
    G.cols.forEach(function(col){
      var v=vOf(col.country, col.ind, y);
      var isPct=(col.ind==="开割率");
      var st=fmt(v, isPct?"pct":"num");
      body+="<td class='"+(st===""?"val-null":"")+"'>"+st+"</td>";
    });
    body+="</tr>";
  });
  body+="</tbody>";
  document.getElementById("annualTable").innerHTML=head+body;
  document.getElementById("annualSub").textContent=
    (curView==="byIndicator"?"按指标视图 · 五组并列，组内 全球合计 + 14 国":"按国家视图 · 每国五指标（首组全球合计）")+
    " · 2003 ~ "+(D.latestYear||"")+(D.globalNote?" · "+D.globalNote:"");
}

/* 国家过滤（图表上方按钮）：null=全部，单国字符串=仅该国 */
var chartCountryFilter=null;
function chartCountriesFiltered(){

}

/* ---------- 图表：3 堆积柱（新增面积/总面积/割胶面积）+ 2 折线（开割率/亩产） ---------- */
/* 图表仅展示 10 国（chartCountries，不含 巴西/危地马拉/哥伦比亚/墨西哥）；折线各国不同颜色 */
function barChartOption(ind){
  var series=chartCountriesFiltered().map(function(c){
    return {name:c, type:"bar", stack:"tot", barMaxWidth:22,
      data:D.years.map(function(y){ var v=vOf(c, ind, y); return (v===null||v===undefined)?null:+v.toFixed(1); }),
      itemStyle:{color:(D.countryColors||{})[c]}, emphasis:{focus:"series"}};
  });
  return {
    animation:false,
    tooltip:{trigger:"axis", axisPointer:{type:"shadow"}, confine:true},
    legend:{show:!chartCountryFilter, top:0, type:"scroll", textStyle:{fontSize:10,color:"#6b7686"}},
    grid:{left:8, right:10, top:34, bottom:26, containLabel:true},
    xAxis:{type:"category", data:D.years.map(String), axisLabel:{interval:1, fontSize:10, color:"#8a93a3"},
      axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}}, splitLine:{show:false}},
    yAxis:{type:"value", scale:true, axisLabel:{fontSize:10,color:"#8a93a3"}, splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  };
}
function lineChartOption(ind){
  var series=chartCountriesFiltered().map(function(c){
    var pts=[];
    D.years.forEach(function(y){ var v=vOf(c, ind, y); if(v!==null&&v!==undefined) pts.push([y, +v.toFixed(1)]); });
    if(!pts.length) return null;
    var col=(D.countryColors||{})[c] || "#888";
    return {name:c, type:"line", showSymbol:false, connectNulls:true, data:pts,
      lineStyle:{width:1.8, color:col}, itemStyle:{color:col}, emphasis:{focus:"series"}};
  }).filter(Boolean);
  var showLegend=!chartCountryFilter;
  var legendSelected={};
  if(showLegend){ D.chartCountries.forEach(function(c){ legendSelected[c] = (c!=="菲律宾" && c!=="斯里兰卡"); }); }
  return {
    animation:false,
    tooltip:{trigger:"axis", confine:true,
      formatter:function(ps){ if(!ps.length) return ""; var s=ps[0].axisValue+"年"; ps.forEach(function(p){ s+="<br>"+p.marker+p.seriesName+"： <b>"+fmt(p.value[1], ind==="开割率"?"pct":"num")+"</b>"; }); return s; }},
    legend:{show:showLegend, top:0, type:"scroll", textStyle:{fontSize:10,color:"#6b7686"}, selected:showLegend?legendSelected:undefined},
    grid:{left:8, right:10, top:34, bottom:26, containLabel:true},
    xAxis:{type:"category", data:D.years.map(String), axisLabel:{interval:1, fontSize:10, color:"#8a93a3"},
      axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}}, splitLine:{show:false}},
    yAxis:{type:"value", scale:true, axisLabel:{fontSize:10,color:"#8a93a3"}, splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  };
}
function renderCountryBar(){
  var bar=document.getElementById("countryBar"); if(!bar) return;
  bar.innerHTML="<span class='lbl'>按国家过滤：</span>";
  function pill(label, val){
    var b=document.createElement("button");
    b.className="country-pill"+(chartCountryFilter===val?" active":"")+(val===null?" all":"");
    b.textContent=label;
    b.onclick=function(){
      if(val===null){ chartCountryFilter=null; }
      else if(chartCountryFilter===val){ chartCountryFilter=null; }
      else { chartCountryFilter=val; }
      renderCountryBar();
      renderCharts();
    };
    bar.appendChild(b);
  }
  pill("全部", null);
  D.chartCountries.forEach(function(c){ pill(c, c); });
}
var chartInsts=[];   // {ind, type, inst}，固定 5 张
function buildChartCards(){
  // 仅创建一次：3 堆积柱 + 2 折线 = 5 张固定卡片
  var grid=document.getElementById("chartGrid"); grid.innerHTML='';
  var grid2=document.getElementById("chartGrid2"); grid2.innerHTML='';
  ["总面积","新增面积","割胶面积"].forEach(function(ind){
    var card=document.createElement("div"); card.className="chart-card";
    var cap=document.createElement("div"); cap.className="cap"; cap.textContent=ind+"（各国堆积，千公顷）";
    var ech=document.createElement("div"); ech.className="ech";
    card.appendChild(cap); card.appendChild(ech); grid.appendChild(card);
    var inst=echarts.init(ech);
    inst.setOption(barChartOption(ind));
    chartInsts.push({ind:ind, type:"bar", inst:inst});
  });
  ["开割率","亩产"].forEach(function(ind){
    var card=document.createElement("div"); card.className="chart-card";
    var cap=document.createElement("div"); cap.className="cap"; cap.textContent=ind+(ind==="开割率"?"（各国，%）":"（各国，kg/公顷）");
    var ech=document.createElement("div"); ech.className="ech";
    card.appendChild(cap); card.appendChild(ech); grid2.appendChild(card);
    var inst=echarts.init(ech);
    inst.setOption(lineChartOption(ind));
    chartInsts.push({ind:ind, type:"line", inst:inst});
  });
}
function renderCharts(){
  if(typeof echarts==="undefined"||!D||!D.years) return;
  // 已创建过 → 仅 setOption 更新数据/图例（filter 切换不会新增图表）
  if(chartInsts.length){
    chartInsts.forEach(function(c){
      c.inst.setOption(c.type==="bar"?barChartOption(c.ind):lineChartOption(c.ind), true);
    });
    document.getElementById("chartSub").textContent=(D.globalNote||"")+" · 堆积柱状图：总面积 / 新增面积 / 割胶面积（各国堆积合计）；折线图：开割率 / 亩产（各国多线，不同颜色区分）";
    return;
  }
  // 首次：构建 5 张固定卡片 + 创建 echarts 实例
  buildChartCards();
  document.getElementById("chartSub").textContent=(D.globalNote||"")+" · 堆积柱状图：总面积 / 新增面积 / 割胶面积（各国堆积合计）；折线图：开割率 / 亩产（各国多线，不同颜色区分）";
}

function renderAnnualAndCharts(){ renderAnnual(); renderCharts(); }
function init(){
  if(!D||!D.years){ document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>数据未加载</div>"); return; }
  document.getElementById("pageTitle").textContent="天然橡胶 种面单产";
  document.getElementById("pageSub").textContent=D.pageSub;
  buildTabs();
  var sel=document.getElementById("viewSel");
  sel.onchange=function(){ curView=sel.value; renderAnnual(); };
  renderAnnual();
  renderCountryBar();
  renderCharts();
}
init();
</script>
<script>
/* ECharts 多 CDN 兜底加载，加载成功后再渲染图表（表格已同步渲染） */
(function loadECharts(){
  var urls=[
    "echarts.min.js",
    "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
    "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"
  ];
  var i=0;
  function tryNext(){
    if(i>=urls.length){ return; }
    var s=document.createElement("script");
    s.src=urls[i++]; s.onload=renderCharts; s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

<!-- ===== 激光笔演示按钮（右下角，2026-08-14 起；v2 SVG图标+无外圈） ===== -->
<style>
.laser-fab{position:fixed; right:18px; bottom:18px; z-index:2147483000; width:42px; height:42px; border-radius:50%;
  background:#d8392b; color:#fff; font-size:0; line-height:1; display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.28); opacity:.92; transition:all .2s; border:none; padding:0;}
.laser-fab:hover{opacity:1; transform:scale(1.12);}
.laser-fab.active{background:#922B21; box-shadow:0 0 0 4px rgba(216,57,43,.28);}
.laser-dot{position:fixed; z-index:2147483001; width:18px; height:18px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,#fff 0%,#ff3b30 30%,rgba(255,59,48,.5) 70%,rgba(255,59,48,0) 100%);
  box-shadow:0 0 10px 4px rgba(255,59,48,.6), 0 0 24px 10px rgba(255,59,48,.25);
  transform:translate(-50%,-50%); display:none;}
body.laser-mode{cursor:none !important;}
body.laser-mode *{cursor:none !important;}
</style>
<script>
(function(){
  if(document.getElementById('laserFab')) return;
  var fab=document.createElement('div'); fab.id='laserFab'; fab.className='laser-fab';
  fab.title='激光笔（演示模式）';
  fab.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'
    +'<circle cx="12" cy="12" r="3.5" fill="#fff"/>'
    +'<circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.4" opacity="0.55"/>'
    +'<line x1="12" y1="2" x2="12" y2="5" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'<line x1="12" y1="19" x2="12" y2="22" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'<line x1="2" y1="12" x2="5" y2="12" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'<line x1="19" y1="12" x2="22" y2="12" stroke="#fff" stroke-width="1.2" opacity="0.7"/>'
    +'</svg>';
  var dot=document.createElement('div'); dot.id='laserDot'; dot.className='laser-dot';
  document.body.appendChild(fab); document.body.appendChild(dot);
  var on=false;
  function setOn(v){
    on=v;
    dot.style.display=on?'block':'none';
    fab.classList.toggle('active', on);
    document.body.classList.toggle('laser-mode', on);
  }
  function move(e){
    if(!on) return;
    dot.style.left=e.clientX+'px'; dot.style.top=e.clientY+'px';
  }
  fab.addEventListener('click', function(e){ e.stopPropagation(); setOn(!on); });
  document.addEventListener('mousemove', move);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && on) setOn(false); });
  window.laserSetOn=setOn;
})();
</script>
</body>

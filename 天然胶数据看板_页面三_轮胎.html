<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天然胶数据看板</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --sub:#6b7686;
  --up:#d92626; --down:#0a9a5c; --flat:#8a93a3; --accent:#0f4c81;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; font-size:14px;}
.wrap{max-width:1560px; margin:0 auto; padding:18px 22px 60px;}

.header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.header h1{font-size:24px; color:var(--accent); letter-spacing:1px;}
.header .date{color:var(--sub); font-size:13px;}
.tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 20px; border-radius:8px 8px 0 0; border:1px solid var(--border); border-bottom:none;
  background:#e9edf3; color:var(--sub); cursor:default; font-size:14px; text-decoration:none;}
.tab.active{background:var(--accent); color:#fff; font-weight:600;}
.tab.disabled{opacity:.55;}
a.tab:hover{background:var(--accent); color:#fff;}

.summary{background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 20px; margin-bottom:16px; line-height:1.95;}
.summary h2{font-size:16px; color:var(--accent); margin-bottom:6px;}
.summary .up{color:var(--up); font-weight:600;}
.summary .down{color:var(--down); font-weight:600;}
.summary .flat{color:var(--flat); font-weight:600;}
.summary .lead{display:inline-block; min-width:64px; color:var(--accent); font-weight:700;}

.filterbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px;}
.filterbar .lbl{color:var(--sub); font-size:13px;}
.ybtn{display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:16px;
  border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; user-select:none; transition:all .15s;}
.ybtn .dot{width:10px; height:10px; border-radius:50%;}
.ybtn.off{opacity:.35; filter:grayscale(.6);}
.actions{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end;}
.ybtn.exp{background:var(--accent); color:#fff; border-color:var(--accent);}
.ybtn.exp:hover{filter:brightness(1.08);}
.ybtn:disabled{opacity:.7; cursor:default;}

/* ===== 高清长图导出 ===== */
.exp-modal{position:fixed; inset:0; background:rgba(20,24,33,.55); display:none; align-items:center; justify-content:center; z-index:9999;}
.exp-modal.show{display:flex;}
.exp-box{background:#fff; border-radius:12px; max-width:94vw; max-height:90vh; display:flex; flex-direction:column; overflow:hidden;}
.exp-box-head{padding:12px 16px; font-weight:700; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eef1f6;}
.exp-box-body{overflow:auto; padding:14px; background:#f4f6fa;}
.exp-box-body canvas{max-width:100%; height:auto; display:block;}
.exp-box-foot{padding:10px 16px; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid #eef1f6;}
.exp-box-foot button{cursor:pointer; border:none; border-radius:8px; padding:8px 18px; font-size:14px; font-weight:600;}
.exp-copy{background:var(--accent); color:#fff;}
.exp-dl{background:#eef1f6; color:#1a1a1a;}
.exp-close{background:#eef1f6; color:#1a1a1a;}

.tablecard{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:22px; overflow-x:auto;}
.tablecard h2{font-size:16px; color:var(--accent); margin-bottom:10px;}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:1180px;}
th,td{padding:6px 10px; text-align:right; border-bottom:1px solid #eef1f6; white-space:nowrap;}
th{background:#f0f4f9; color:#44506a; font-weight:600; position:sticky; top:0;}
td:first-child, th:first-child{text-align:left;}
tr.grp td{background:#f7f9fc; color:var(--accent); font-weight:700; text-align:left; font-size:13px;}
td.up{color:var(--up); font-weight:600;} td.down{color:var(--down); font-weight:600;} td.flat{color:var(--flat);}
tr.abn td{background:#fff7f0;}
.badge{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:9px; font-size:11px;
  background:var(--up); color:#fff; vertical-align:1px;}
.badge.dn{background:var(--down);}

.section-title{font-size:18px; color:var(--accent); font-weight:700; margin:26px 0 4px;
  padding-left:10px; border-left:4px solid var(--accent);}
.row-label{font-size:14px; color:var(--sub); margin:14px 0 8px; font-weight:600;}
.grid{display:grid; gap:14px;}
.grid.c1{grid-template-columns:repeat(2,1fr);}
.grid.c2{grid-template-columns:repeat(2,1fr);}
.grid.c3{grid-template-columns:repeat(3,1fr);}
.grid.c4{grid-template-columns:repeat(4,1fr);}
.grid.c5{grid-template-columns:repeat(5,1fr);}
@media (max-width:1400px){ .grid.c5{grid-template-columns:repeat(3,1fr);} }
@media (max-width:1200px){ .grid.c4,.grid.c3{grid-template-columns:repeat(2,1fr);} .grid.c5{grid-template-columns:repeat(2,1fr);} }
@media (max-width:720px){ .grid.c1,.grid.c2,.grid.c3,.grid.c4,.grid.c5{grid-template-columns:1fr;} .wrap{padding:12px 10px 40px;} }

.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px 6px; min-width:0;}
.card .ttl{font-size:14px; font-weight:700; color:#2a3345;}
.card .meta{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:4px 0 2px;}
.card .val{font-size:20px; font-weight:700;}
.card .unit{font-size:11px; color:var(--sub);}
.card .chg{font-size:13px; font-weight:600;}
.card .chg.up{color:var(--up);} .card .chg.down{color:var(--down);} .card .chg.flat{color:var(--flat);}
.card .dt{font-size:11px; color:var(--sub);}
.chart{width:100%; height:200px;}
.card.short .chart{height:165px;}
@media (max-width:720px){ .chart{height:185px;} }
.footer{margin-top:30px; color:var(--sub); font-size:12px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>天然胶数据看板</h1>
    <div class="actions">
      <div class="date">数据截至：<b id="latestDate"></b>　|　<span id="pageSub"></span></div>
      <button id="btnExport" class="ybtn exp" type="button" onclick="exportLongImage(this)">导出高清长图</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>

  <div class="summary" id="summary"></div>

  <div class="filterbar" id="filterbar"><span class="lbl">年份筛选（点击显隐，作用于全部季节图）：</span></div>

  <div class="tablecard">
    <h2>最新数据一览表 <span style="font-size:12px;color:var(--sub);font-weight:400" id="tableNote"></span></h2>
    <table id="dataTable">
      <thead><tr>
        <th>指标</th><th>单位</th><th>最新日期</th><th>最新值</th><th>前值</th><th>日环比增减</th><th>日环比%</th><th>标记</th>
        <th>上周值</th><th>周环比增减</th><th>周环比%</th><th>标记</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="sections"></div>

  <div class="footer">天然胶数据看板 · <span id="footPage"></span> · 涨=红 跌=绿 · 年份按固定配色区分（21青绿 / 22紫 / 23蓝 / 24橙 / 25红 / 26黑）</div>
</div>

<div id="expHost" style="position:fixed;left:-100000px;top:0;width:0;height:0;overflow:hidden;"></div>
<div id="expModal" class="exp-modal">
  <div class="exp-box">
    <div class="exp-box-head"><span>天然胶数据看板 · 高清长图</span><button class="exp-close" type="button" onclick="closeExpModal()">✕</button></div>
    <div class="exp-box-body" id="expModalBody"></div>
    <div class="exp-box-foot">
      <button class="exp-dl" type="button" onclick="downloadExpImage()">下载PNG</button>
      <button class="exp-copy" id="expCopyBtn" type="button" onclick="copyExpImage()">复制图片</button>
    </div>
  </div>
</div>

    if(!r||r.chg===null||r.chg===undefined) return "（—）";
    var cls=chgCls(r.chg), sign=r.chg>0?"+":"";
    var s="<span class='"+cls+"'>"+sign+fmt(r.chg,r.dec);
    if(withPct && r.pct!==null && r.pct!==undefined) s+="，"+(r.pct>0?"+":"")+r.pct.toFixed(2)+"%";
    s+="</span>";
    return "（"+s+"）";
  }
  function seg(key,name,withPct){
    var r=byKey[key]; if(!r) return "";
    return name+" <b>"+fmt(r.latest,r.dec)+"</b>"+chgSpan(r,withPct);
  }
  var d=D.latestDataDate.slice(5).split("-");
  var dateTxt=parseInt(d[0],10)+"月"+parseInt(d[1],10)+"日";

  var html="<h2>核心变化速览</h2>";
  (D.summary.groups||[]).forEach(function(grp){
    html+="<div><span class='lead'>"+grp.lead+" · </span>"+dateTxt+"，";
    html+=grp.items.map(function(it){ return seg(it.key,it.name,it.pct); }).join("、")+"。</div>";
  });
  if(D.summary.spotRanking){
    var spotSet={}; D.spotKeys.forEach(function(k){ spotSet[k]=1; });
    var spot=D.table.filter(function(r){ return spotSet[r.key] && r.pct!==null && r.pct!==undefined && r.chg!==0; });
    var ups=spot.filter(function(r){return r.chg>0;}).sort(function(a,b){return b.pct-a.pct;});
    var dns=spot.filter(function(r){return r.chg<0;}).sort(function(a,b){return a.pct-b.pct;});
    function liSpan(r){
      return "<span class='"+(r.chg>0?"up":"down")+"'>"+r.title+"（"+(r.chg>0?"+":"")+fmt(r.chg,r.dec)+"，"+(r.pct>0?"+":"")+r.pct.toFixed(2)+"%）</span>";
    }
    html+="<div><span class='lead'>现货 · </span>涨幅居前："+(ups.length?ups.slice(0,3).map(liSpan).join("、"):"无")+"；";
    html+="跌幅居前："+(dns.length?dns.slice(0,3).map(liSpan).join("、"):"无")+"。</div>";
  }
  document.getElementById("summary").innerHTML=html;
}

function buildTable(){
  var tb=document.querySelector("#dataTable tbody");
  var groups={};
  D.layout.forEach(function(sec){
    sec.rows.forEach(function(row){
      row.charts.forEach(function(ch){ if(!ch.ts) groups[ch.key]=row.grp||sec.section; });
    });
  });
  var lastGrp=null;
  D.table.forEach(function(r){
    var g=groups[r.key]||"";
    if(g!==lastGrp){
      var trg=document.createElement("tr"); trg.className="grp";
      trg.innerHTML="<td colspan='12'>"+g+"</td>"; tb.appendChild(trg); lastGrp=g;
    }
    var elig=!r.spread;
    var dAbn=elig && r.pct!==null && Math.abs(r.pct)>=2;
    var wAbn=elig && r.weekPct!==null && Math.abs(r.weekPct)>=2;
    var dCls=chgCls(r.chg), wCls=chgCls(r.weekChg);
    var tr=document.createElement("tr");
    if(dAbn||wAbn) tr.className="abn";
    tr.innerHTML=
      "<td>"+r.title+"</td><td style='color:var(--sub)'>"+r.unit+"</td>"+
      "<td style='color:var(--sub)'>"+(r.latestDate||"—")+"</td>"+
      "<td><b>"+fmt(r.latest,r.dec)+"</b></td>"+
      "<td>"+fmt(r.prev,r.dec)+"</td>"+
      "<td class='"+dCls+"'>"+((r.chg>0?"+":"")+fmt(r.chg,r.dec))+"</td>"+
      "<td class='"+dCls+"'>"+(r.pct===null?"—":(r.pct>0?"+":"")+r.pct.toFixed(2)+"%")+"</td>"+
      "<td>"+(dAbn?"<span class='badge"+(r.chg<0?" dn":"")+"'>大幅"+(r.chg>0?"上涨":"下跌")+"</span>":"")+"</td>"+
      "<td>"+fmt(r.weekAgo,r.dec)+"</td>"+
      "<td class='"+wCls+"'>"+((r.weekChg>0?"+":"")+fmt(r.weekChg,r.dec))+"</td>"+
      "<td class='"+wCls+"'>"+(r.weekPct===null?"—":(r.weekPct>0?"+":"")+r.weekPct.toFixed(2)+"%")+"</td>"+
      "<td>"+(wAbn?"<span class='badge"+(r.weekChg<0?" dn":"")+"'>大幅"+(r.weekChg>0?"上涨":"下跌")+"</span>":"")+"</td>";
    tb.appendChild(tr);
  });
}

function monthTicks(){
  var idx={};
  D.xlabels.forEach(function(l,i){ if(l.slice(3)==="01") idx[i]=parseInt(l.slice(0,2),10)+"月"; });
  return idx;
}

function buildSections(){
  var root=document.getElementById("sections");
  var ticks=monthTicks();
  D.layout.forEach(function(sec){
    var h=document.createElement("div");
    h.className="section-title"; h.textContent=sec.section;
    root.appendChild(h);
    sec.rows.forEach(function(row){
      var lbl=document.createElement("div");
      lbl.className="row-label"; lbl.textContent=row.label;
      root.appendChild(lbl);
      var grid=document.createElement("div");
      grid.className="grid c"+Math.min(row.charts.length,5);
      root.appendChild(grid);
      row.charts.forEach(function(ch){ makeCard(ch,ticks,grid,row); });
    });
  });
}

/* 季节图卡片 */
function makeCard(ch,ticks,grid,row){
  var ind=D.indicators[ch.key], st=ind.stat;
  var card=document.createElement("div"); card.className="card";
  var cls=chgCls(st.chg);
  card.innerHTML=
    '<div class="ttl">'+ind.title+'</div>'+
    '<div class="meta">'+
      '<span class="val">'+fmt(st.latest,ind.dec)+'<span class="unit"> '+ind.unit+'</span></span>'+
      '<span class="chg '+cls+'">'+arrow(st.chg)+' '+(st.chg>0?"+":"")+fmt(st.chg,ind.dec)+
        '（'+(st.pct===null?"—":(st.pct>0?"+":"")+st.pct.toFixed(2)+"%")+' 日环比）</span>'+
      '<span class="dt">'+(st.latestDate||"")+'</span>'+
    '</div>';
  var div=document.createElement("div"); div.className="chart"; card.appendChild(div);
  grid.appendChild(card);
  var c=echarts.init(div);
  var series=[], legend=[];
  D.years.forEach(function(y){
    var pts=ind.series[String(y)];
    if(!pts||!pts.length) return;
    legend.push(String(y));
    var isLatest = (y===D.years[D.years.length-1]);
    series.push({
      name:String(y), type:"line", showSymbol:false, connectNulls:true,
      data:pts,
      lineStyle:{width: isLatest?2.2:1.4, color:yearColor(y)},
      itemStyle:{color:yearColor(y)},
      emphasis:{focus:"series"},
      z: isLatest?10:5
    });
  });
  c.setOption({
    animation:false,
    grid:{left:8,right:14,top:26,bottom:4,containLabel:true},
    legend:{show:true, top:0, right:0, itemWidth:14, itemHeight:2, icon:"rect",
      textStyle:{fontSize:11,color:"#6b7686"}, data:legend},
    tooltip:{trigger:"axis", confine:true,
      formatter:function(ps){
        if(!ps.length) return "";
        var lab=D.xlabels[ps[0].value[0]];
        var s=parseInt(lab.slice(0,2),10)+"月"+parseInt(lab.slice(3),10)+"日";
        ps.sort(function(a,b){return Number(b.seriesName)-Number(a.seriesName);});
        ps.forEach(function(p){
          s+="<br>"+p.marker+p.seriesName+"年： <b>"+fmt(p.value[1],ind.dec)+"</b>";
        });
        return s;
      }},
    xAxis:{type:"value", min:0, max:365, interval:1,
      axisLabel:{fontSize:10,color:"#8a93a3",
        formatter:function(v){ return ticks[v]||""; }},
      axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}},
      splitLine:{show:false}},
    yAxis:{type:"value", scale:true,
      axisLabel:{fontSize:10,color:"#8a93a3",
        formatter:function(v){ return Math.abs(v)>=10000?(v/10000)+"万":(Math.abs(v)>=1000?(v/1000)+"k":v); }},
      splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  });
  D.years.forEach(function(y){
    if(!yearVisible[y]) c.dispatchAction({type:"legendToggleSelect",name:String(y)});
  });
  charts.push(c); allCharts.push(c);
}
</script>

<script>
/* ===== 高清长图导出：逐图 getDataURL() 后在原生 canvas 上拼合 ===== */
var TILE_W=440, TILE_H=340, SCALE=2, GAP=12, MARGIN=24, BANNER=56;
var EXP_ACCENT="#0f4c81";

function expMonthTicks(D){
  var idx={};
  (D.xlabels||[]).forEach(function(l,i){ if(l.slice(3)==="01") idx[i]=parseInt(l.slice(0,2),10)+"月"; });
  return idx;
}

function exportOption(D, ch){
  var ind=D.indicators[ch.key], st=ind.stat;
  var series=[], legend=[];
  D.years.forEach(function(y){
    var pts=ind.series[String(y)];
    if(!pts||!pts.length) return;
    legend.push(String(y));
    var isLatest=(y===D.years[D.years.length-1]);
    series.push({name:String(y), type:"line", showSymbol:false, connectNulls:true, data:pts,
      lineStyle:{width:isLatest?2.4:1.4, color:yearColor(y)}, itemStyle:{color:yearColor(y)},
      emphasis:{focus:"series"}, z:isLatest?10:5});
  });
  var valTxt=fmt(st.latest,ind.dec)+" "+ind.unit;
  var chgTxt="";
  if(st.chg!==null && st.chg!==undefined){
    chgTxt=arrow(st.chg)+" "+(st.chg>0?"+":"")+fmt(st.chg,ind.dec)
      +"（"+(st.pct===null?"—":(st.pct>0?"+":"")+st.pct.toFixed(2)+"%")+" 日环比）";
  }
  var subColor = st.chg>0?"#d92626":(st.chg<0?"#0a9a5c":"#6b7686");
  var ticks=expMonthTicks(D);
  return {
    animation:false, backgroundColor:"#ffffff",
    title:{ text:ind.title, subtext:valTxt+(chgTxt?"   "+chgTxt:""),
      left:12, top:10, textStyle:{fontSize:20, fontWeight:700, color:"#1f2733"},
      subtextStyle:{fontSize:15, color:subColor} },
    grid:{left:14, right:18, top:70, bottom:46, containLabel:true},
    legend:{show:true, bottom:6, left:"center", itemWidth:18, itemHeight:3, icon:"rect",
      textStyle:{fontSize:13, color:"#6b7686"}, data:legend},
    tooltip:{trigger:"axis", confine:true},
    xAxis:{type:"value", min:0, max:365, interval:1,
      axisLabel:{fontSize:13,color:"#8a93a3", formatter:function(v){ return ticks[v]||""; }},
      axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}}, splitLine:{show:false}},
    yAxis:{type:"value", scale:true,
      axisLabel:{fontSize:13,color:"#8a93a3",
        formatter:function(v){ return Math.abs(v)>=10000?(v/10000)+"万":(Math.abs(v)>=1000?(v/1000)+"k":v); }},
      splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  };
}

function exportLongImage(btn){
  if(!btn){ btn=document.getElementById("btnExport"); }
  var oldHtml=btn.innerHTML;
  btn.innerHTML="生成中…"; btn.disabled=true;
  try{
    var sheets=[{title:(D.pageTitle||"天然胶数据看板"), D:window.__DATA__}].filter(function(s){ return s.D && s.D.layout; });

    var PAGE_TITLE_H=52, SECTION_H=44, ROW_H=36;
    var maxCols=1;
    sheets.forEach(function(s){
      s.D.layout.forEach(function(sec){
        sec.rows.forEach(function(row){
          var cols=Math.min(row.charts.length,5);
          if(cols>maxCols) maxCols=cols;
        });
      });
    });
    var contentW=maxCols*TILE_W+(maxCols-1)*GAP;
    var Wcss=contentW+2*MARGIN;
    var Hcss=MARGIN+BANNER+22;
    sheets.forEach(function(s){
      Hcss+=PAGE_TITLE_H;
      s.D.layout.forEach(function(sec){
        Hcss+=SECTION_H;
        sec.rows.forEach(function(row){
          if(row.label) Hcss+=ROW_H;
          Hcss+=TILE_H+GAP;
        });
      });
    });
    Hcss=Hcss-GAP+MARGIN;
    var scale=SCALE;
    if(Math.max(Wcss,Hcss)*scale>16384) scale=16384/Math.max(Wcss,Hcss);
    scale=Math.max(1, Math.floor(scale*100)/100);

    var host=document.getElementById("expHost");
    if(!host){ host=document.createElement("div"); host.id="expHost";
      host.style.cssText="position:fixed;left:-100000px;top:0;width:0;height:0;overflow:hidden;";
      document.body.appendChild(host); }

    var tiles=[];
    sheets.forEach(function(s){
      var Dp=s.D;
      Dp.layout.forEach(function(sec){
        sec.rows.forEach(function(row){
          row.charts.forEach(function(ch){
            var div=document.createElement("div");
            div.style.width=TILE_W+"px"; div.style.height=TILE_H+"px";
            host.appendChild(div);
            var c=echarts.init(div, null, {width:TILE_W, height:TILE_H});
            c.setOption(exportOption(Dp, ch));
            tiles.push(c.getDataURL({pixelRatio:scale, backgroundColor:"#ffffff"}));
            c.dispose(); div.remove();
          });
        });
      });
    });

    var textOps=[], positions=[], curY=MARGIN+BANNER+22, tileIdx=0;
    sheets.forEach(function(s){
      var Dp=s.D;
      textOps.push({x:MARGIN, y:curY+PAGE_TITLE_H/2, text:s.title+"　数据截至："+Dp.latestDataDate, size:28, color:EXP_ACCENT, bold:true});
      curY+=PAGE_TITLE_H;
      Dp.layout.forEach(function(sec){
        textOps.push({x:MARGIN, y:curY+SECTION_H/2, text:"▍"+sec.section, size:24, color:EXP_ACCENT, bold:true});
        curY+=SECTION_H;
        sec.rows.forEach(function(row){
          if(row.label){ textOps.push({x:MARGIN, y:curY+ROW_H/2, text:row.label, size:17, color:"#6b7686", bold:false}); curY+=ROW_H; }
          var x=MARGIN;
          for(var k=0;k<row.charts.length;k++){
            positions.push({url:tiles[tileIdx], x:Math.round(x*scale), y:Math.round(curY*scale), w:Math.round(TILE_W*scale), h:Math.round(TILE_H*scale)});
            tileIdx++; x+=TILE_W+GAP;
          }
          curY+=TILE_H+GAP;
        });
      });
    });

    var W=Math.round(Wcss*scale), H=Math.round(Hcss*scale);
    var canvas=document.createElement("canvas"); canvas.width=W; canvas.height=H;
    var ctx=canvas.getContext("2d");
    ctx.fillStyle="#f4f6fa"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=EXP_ACCENT; ctx.fillRect(0,0,W,Math.round(BANNER*scale));
    ctx.fillStyle="#ffffff"; ctx.font="bold "+(26*scale)+"px 'Microsoft YaHei',sans-serif";
    ctx.textBaseline="middle"; ctx.fillText("天然胶数据看板 · 高清长图", 24*scale, BANNER*scale/2);
    textOps.forEach(function(t){
      ctx.fillStyle=t.color;
      ctx.font=(t.bold?"bold ":"")+(t.size*scale)+"px 'Microsoft YaHei','PingFang SC',sans-serif";
      ctx.textBaseline="middle";
      ctx.fillText(t.text, t.x*scale, t.y*scale);
    });
    var pending=positions.map(function(p){
      return new Promise(function(res){
        var im=new Image();
        im.onload=function(){ p._img=im; res(); };
        im.onerror=function(){ res(); };
        im.src=p.url;
      });
    });
    Promise.all(pending).then(function(){
      positions.forEach(function(p){
        if(p._img) ctx.drawImage(p._img, p.x, p.y, p.w, p.h);
        ctx.strokeStyle="#e5e9f0"; ctx.lineWidth=Math.max(1,Math.round(scale));
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      });
      showExpModal(canvas);
      btn.innerHTML=oldHtml; btn.disabled=false;
    });
  }catch(e){
    console.error(e);
    alert("导出失败："+(e&&e.message||e));
    btn.innerHTML=oldHtml; btn.disabled=false;
  }
}

function showExpModal(canvas){
  var modal=document.getElementById('expModal');
  var body=document.getElementById('expModalBody');
  body.innerHTML=''; body.appendChild(canvas);
  canvas.style.maxWidth='100%'; canvas.style.height='auto';
  modal._canvas=canvas;
  modal.classList.add('show');
}

function copyExpImage(){
  var modal=document.getElementById('expModal');
  var canvas=modal._canvas;
  if(!canvas) return;
  if(!navigator.clipboard || !window.ClipboardItem){
    alert('当前浏览器不支持图片复制到剪贴板，请改用「下载PNG」后手动粘贴。');
    return;
  }
  canvas.toBlob(function(blob){
    if(!blob){ alert('复制失败：图片生成异常'); return; }
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
      var b=document.getElementById('expCopyBtn'); var o=b.textContent; b.textContent='已复制 ✓';
      setTimeout(function(){ b.textContent=o; }, 1500);
    }).catch(function(e){ alert('复制失败：'+(e&&e.message||e)); });
  }, 'image/png');
}

function downloadExpImage(){
  var modal=document.getElementById('expModal');
  var canvas=modal._canvas;
  if(!canvas) return;
  var d=new Date(); var p=function(n){return ('0'+n).slice(-2);};
  var a=document.createElement('a');
  a.download='天然胶数据看板_高清长图_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
}

function closeExpModal(){
  var modal=document.getElementById('expModal');
  modal.classList.remove('show');
  modal._canvas=null;
  var body=document.getElementById('expModalBody'); if(body) body.innerHTML='';
}

window.exportLongImage=exportLongImage;
window.copyExpImage=copyExpImage;
window.downloadExpImage=downloadExpImage;
window.closeExpModal=closeExpModal;
</script>
</body>
</html>
